name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest ruff
      - name: Lint
        run: ruff check mcp_server/ --exit-zero
      - name: Run tests
        run: pytest mcp_server/tests/ -v